// ── North orientation ─────────────────────────────────────────────────────────
let northAnim = null;

function orientNorth() {
  if (northAnim) cancelAnimationFrame(northAnim);

  const startTheta = spherical.theta;
  // Normalise to [-PI, PI] so we take the shortest arc to 0
  let delta = -((startTheta % (2*Math.PI)) + (startTheta % (2*Math.PI) > Math.PI ? -2*Math.PI : startTheta % (2*Math.PI) < -Math.PI ? 2*Math.PI : 0));
  // Simpler: just get shortest rotation to theta=0
  let current = ((startTheta % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI); // 0..2PI
  if (current > Math.PI) current -= 2*Math.PI;                           // -PI..PI
  delta = -current;

  const startPhi = spherical.phi;
  const targetPhi = 1.1; // keep same tilt
  const duration = 600; // ms
  const t0 = performance.now();

  function step(now) {
    const t = Math.min((now - t0) / duration, 1);
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t; // ease in-out quad
    spherical.theta = startTheta + delta * ease;
    spherical.phi   = startPhi + (targetPhi - startPhi) * ease;
    updateCamera();
    updateCompass();
    if (t < 1) northAnim = requestAnimationFrame(step);
    else northAnim = null;
  }
  northAnim = requestAnimationFrame(step);
}

// Rotate the compass needle to reflect current theta
function updateCompass() {
  const needle = document.getElementById('compass-needle');
  if (!needle) return;
  // theta=0 → camera looks from south → north arrow points up (0 deg)
  // theta increases → camera rotates clockwise → north arrow rotates counter-clockwise
  const deg = (spherical.theta * 180 / Math.PI) % 360;
  needle.setAttribute('transform', `rotate(${deg}, 20, 20)`);
}

function animate() {
  animId = requestAnimationFrame(animate);
  // No per-frame zoom lerp — zoom is applied instantly on wheel event
  renderer.render(scene, camera);
  updateCompass();
}

function onResize() {
  const c = document.getElementById('canvas-container');
  camera.aspect = c.clientWidth / c.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(c.clientWidth, c.clientHeight);
}

// ─── Build terrain mesh ───────────────────────────────────────────────────────
function buildMesh(dem, cmap, exag) {
  // Remove old mesh
  if (mesh)      { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); }
  if (wireframe) { scene.remove(wireframe); wireframe.geometry.dispose(); wireframe.material.dispose(); }

  const { width, height, data, noData } = dem;

  // Use real-world pixel scale for correct aspect ratio.
  // realWidth/realHeight are in map units (e.g. metres for projected CRS).
  // Fallback to pixel dimensions if not available (PNG, XYZ, etc.)
  const realW = dem.realWidth  || width;
  const realH = dem.realHeight || height;

  // Determine valid range
  let zMin = Infinity, zMax = -Infinity;
  for (let i = 0; i < data.length; i++) {
    const z = data[i];
    if (isNaN(z)) continue;
    if (noData !== null && Math.abs(z - noData) < 0.001 * Math.abs(noData || 1)) continue;
    if (z < zMin) zMin = z;
    if (z > zMax) zMax = z;
  }
  if (!isFinite(zMin)) { zMin = 0; zMax = 1; }
  const zRange = zMax - zMin || 1;

  // Scale the mesh so 1 world unit = realW map units in X.
  // Vertical: zRange metres maps to exag * (zRange / realW) world units.
  const worldW = 1.0;
  const worldH = realH / realW;          // correct geographic aspect ratio
  const zScale = exag * (zRange / realW); // vertical exaggeration in world units
  worldToMetres = realW; // 1 world unit = realW metres

  // Subsample large DEMs for performance
  const MAX_VERTS = 800;
  const stepX = Math.max(1, Math.ceil(width  / MAX_VERTS));
  const stepY = Math.max(1, Math.ceil(height / MAX_VERTS));
  const cols  = Math.ceil(width  / stepX);
  const rows  = Math.ceil(height / stepY);

  const geo = new THREE.PlaneGeometry(worldW, worldH, cols-1, rows-1);
  geo.rotateX(-Math.PI / 2);

  const positions = geo.attributes.position.array;
  const colors    = new Float32Array(positions.length);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const si = r * cols + c;
      const srcR = Math.min(Math.round(r * stepY), height-1);
      const srcC = Math.min(Math.round(c * stepX), width-1);
      const raw  = data[srcR * width + srcC];
      const valid = !isNaN(raw) && (noData === null || Math.abs(raw - noData) > 0.001 * Math.abs(noData || 1));
      const t = valid ? (raw - zMin) / zRange : 0;
      const z = valid ? t * zScale : 0;

      positions[si*3 + 1] = z; // Y is up

      const rgb = sampleCmap(cmap, t);
      colors[si*3]   = rgb[0];
      colors[si*3+1] = rgb[1];
      colors[si*3+2] = rgb[2];
    }
  }

  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();

  const mat = new THREE.MeshPhongMaterial({
    vertexColors: true,
    side: THREE.DoubleSide,
    shininess: 0,
    specular: new THREE.Color(0x000000),
  });

  mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  mesh.castShadow = true;
  // Centre vertically: shift down by half the elevation range in world units
  mesh.position.y = -zScale * 0.5;
  scene.add(mesh);

  // Wireframe overlay
  const wMat = new THREE.MeshBasicMaterial({
    color: 0x00e5a0,
    wireframe: true,
    transparent: true,
    opacity: showWire ? 0.15 : 0
  });
  wireframe = new THREE.Mesh(geo.clone(), wMat);
  wireframe.position.copy(mesh.position);
  scene.add(wireframe);

  return { zMin, zMax, zRange };
}

// ─── Build mesh from OBJ data ─────────────────────────────────────────────────
function buildMeshOBJ(obj, exag) {
  if (mesh)      { scene.remove(mesh);      mesh.geometry.dispose();      mesh.material.dispose(); }
  if (wireframe) { scene.remove(wireframe); wireframe.geometry.dispose(); wireframe.material.dispose(); }

  const { vx, vy, vz, vr, vg, vb, nVerts, nFaces, hasVColor, hasNormals } = obj;
  const { fi, fj, fk, fni, fnj, fnk, nx, ny, nz } = obj;

  // Compute bounds
  let xMin=Infinity,xMax=-Infinity,yMin=Infinity,yMax=-Infinity,zMin=Infinity,zMax=-Infinity;
  for (let i = 0; i < nVerts; i++) {
    if (vx[i]<xMin) xMin=vx[i]; if (vx[i]>xMax) xMax=vx[i];
    if (vy[i]<yMin) yMin=vy[i]; if (vy[i]>yMax) yMax=vy[i];
    if (vz[i]<zMin) zMin=vz[i]; if (vz[i]>zMax) zMax=vz[i];
  }
  const xRange = xMax-xMin || 1;
  const yRange = yMax-yMin || 1;
  const zRange = zMax-zMin || 1;
  const maxRange = Math.max(xRange, yRange);
  const zScaleOBJ = (zRange / maxRange); // true 1:1 scale — exag slider does not apply to OBJ
  worldToMetres = maxRange; // 1 world unit = maxRange metres

  const geo = new THREE.BufferGeometry();

  // ── Positions ──────────────────────────────────────────────────────────────
  // OBJ (Metashape): X=right, Y=north/depth, Z=elevation(up)
  // Three.js:        X=right, Y=up,           Z=toward viewer
  // Map: OBJ X→X, OBJ Z→Y(up), OBJ Y→-Z  — negating preserves CCW winding
  const pos = new Float32Array(nVerts * 3);
  for (let i = 0; i < nVerts; i++) {
    pos[i*3]   =  (vx[i] - xMin - xRange*0.5) / maxRange;
    pos[i*3+1] =  (vz[i] - zMin) / zRange * zScaleOBJ;
    pos[i*3+2] = -(vy[i] - yMin - yRange*0.5) / maxRange;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

  // ── Normals ────────────────────────────────────────────────────────────────
  // Axis swap matches position transform: OBJ(nx,ny,nz) → THREE(nx, nz, -ny)
  // Scale is uniform so no inverse-transpose correction needed — just swap and renorm.
  if (hasNormals) {
    const norm = new Float32Array(nVerts * 3);
    for (let i = 0; i < nVerts; i++) {
      const tnx =  nx[i];
      const tny =  nz[i];   // OBJ Z (up) → THREE Y (up)
      const tnz = -ny[i];   // OBJ Y (north) → THREE -Z
      const len = Math.sqrt(tnx*tnx + tny*tny + tnz*tnz) || 1;
      norm[i*3]   = tnx/len;
      norm[i*3+1] = tny/len;
      norm[i*3+2] = tnz/len;
    }
    geo.setAttribute('normal', new THREE.BufferAttribute(norm, 3));
  }

  // ── Vertex colours ─────────────────────────────────────────────────────────
  const cols = new Float32Array(nVerts * 3);
  if (hasVColor && colourMode === 'photo') {
    for (let i = 0; i < nVerts; i++) {
      cols[i*3]=vr[i]; cols[i*3+1]=vg[i]; cols[i*3+2]=vb[i];
    }
  } else {
  // Solid white — lighting provides all the hillshade contrast
    for (let i = 0; i < nVerts; i++) { cols[i*3]=1.0; cols[i*3+1]=1.0; cols[i*3+2]=1.0; }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));

  // ── Face indices ───────────────────────────────────────────────────────────
  const idx = new Uint32Array(nFaces * 3);
  for (let i = 0; i < nFaces; i++) {
    idx[i*3]=fi[i]; idx[i*3+1]=fj[i]; idx[i*3+2]=fk[i];
  }
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  // flatShading computes per-face normals internally — no need for vertex normals

  // ── Material — flat shading matches Point Studio's crisp edge rendering ──────
  const mat = new THREE.MeshPhongMaterial({
    vertexColors: true,
    side: THREE.DoubleSide,
    shininess: 0,
    specular: new THREE.Color(0x000000),
    flatShading: true,
  });

  mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = -zScaleOBJ * 0.5;
  scene.add(mesh);

  // Wireframe overlay
  const wMat = new THREE.MeshBasicMaterial({
    color: 0x00e5a0, wireframe: true, transparent: true,
    opacity: showWire ? 0.12 : 0
  });
  wireframe = new THREE.Mesh(geo.clone(), wMat);
  wireframe.position.copy(mesh.position);
  scene.add(wireframe);

  return { zMin, zMax, zRange: zMax-zMin, isOBJ: true };
}


function rebuildColors(dem, cmap) {
  if (!mesh || !dem) return;
  const { width, height, data, noData } = dem;
  let zMin = Infinity, zMax = -Infinity;
  for (let i = 0; i < data.length; i++) {
    const z = data[i];
    if (isNaN(z)) continue;
    if (noData !== null && Math.abs(z - noData) < 0.001 * Math.abs(noData || 1)) continue;
    if (z < zMin) zMin = z;
    if (z > zMax) zMax = z;
  }
  const zRange = zMax - zMin || 1;

  const MAX_VERTS = 800;
  const stepX = Math.max(1, Math.ceil(width  / MAX_VERTS));
  const stepY = Math.max(1, Math.ceil(height / MAX_VERTS));
  const cols  = Math.ceil(width  / stepX);
  const rows  = Math.ceil(height / stepY);

  const colorAttr = mesh.geometry.attributes.color;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const si = r * cols + c;
      const srcR = Math.min(Math.round(r * stepY), height-1);
      const srcC = Math.min(Math.round(c * stepX), width-1);
      const raw = data[srcR * width + srcC];
      const valid = !isNaN(raw) && (noData === null || Math.abs(raw - noData) > 0.001 * Math.abs(noData || 1));
      const t = valid ? (raw - zMin) / zRange : 0;
      const rgb = sampleCmap(cmap, t);
      colorAttr.array[si*3]   = rgb[0];
      colorAttr.array[si*3+1] = rgb[1];
      colorAttr.array[si*3+2] = rgb[2];
    }
  }
  colorAttr.needsUpdate = true;
}

// ─── Colorbar ─────────────────────────────────────────────────────────────────
function drawColorbar(cmap, zMin, zMax) {
  const canvas = document.getElementById('colorbar-gradient');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 160, 0, 0);
  for (let i = 0; i <= 20; i++) {
    const t = i / 20;
    const [r,g,b] = sampleCmap(cmap, t);
    grad.addColorStop(t, `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`);
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 14, 160);
  document.getElementById('cb-min').textContent = zMin.toFixed(1) + 'm';
  document.getElementById('cb-max').textContent = zMax.toFixed(1) + 'm';
}

}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.add('visible');
  setTimeout(() => el.classList.remove('visible'), 6000);
}

function setProgress(pct, text) {
  document.getElementById('progress-fill').style.width = pct + '%';
  if (text) document.getElementById('loading-text').textContent = text;
}

function showViewer(dem, stats) {
  document.getElementById('dropzone').classList.add('hidden');
  document.getElementById('canvas-container').classList.add('visible');
  document.getElementById('bottom-bar').classList.add('visible');
  document.getElementById('colorbar').classList.add('visible');
  document.getElementById('north-btn').classList.add('visible');


  // Show/hide colour mode toggle based on whether loaded data has baked colours
  const hasPhoto = dem.type === 'mesh' && dem.hasVColor;
}

function setColourMode(mode) {
  if (!demData || demData.type !== 'mesh') return;
  colourMode = mode;

  const { vz, vr, vg, vb, nVerts, hasVColor } = demData;
  const colorAttr = mesh.geometry.attributes.color;

  if (hasVColor && mode === 'photo') {
    for (let i = 0; i < nVerts; i++) {
      colorAttr.array[i*3]   = vr[i];
      colorAttr.array[i*3+1] = vg[i];
      colorAttr.array[i*3+2] = vb[i];
    }
  } else {
    // Solid white hillshade
    for (let i = 0; i < nVerts; i++) {
      colorAttr.array[i*3]=1.0; colorAttr.array[i*3+1]=1.0; colorAttr.array[i*3+2]=1.0;
    }
  }
  colorAttr.needsUpdate = true;
}

function resetViewer() {
  demData = null;
  if (mesh)      { scene.remove(mesh);      mesh.geometry.dispose();      mesh.material.dispose(); }
  if (wireframe) { scene.remove(wireframe); wireframe.geometry.dispose(); wireframe.material.dispose(); }
  document.getElementById('dropzone').classList.remove('hidden');
  document.getElementById('canvas-container').classList.remove('visible');
  document.getElementById('bottom-bar').classList.remove('visible');
  document.getElementById('colorbar').classList.remove('visible');
  document.getElementById('north-btn').classList.remove('visible');
  clearGrade();
  clearMeasure();
  measureMode = false;
  document.getElementById('file-meta').textContent = 'No file loaded';
  resetCamera();
}

// ─── File processing ──────────────────────────────────────────────────────────
async function processFile(file) {
  setLoading(true, 'READING FILE', 5);
  document.getElementById('file-meta').textContent = file.name + ' · ' + (file.size/1024/1024).toFixed(1) + ' MB';

  try {
    const ext = file.name.split('.').pop().toLowerCase();
    let dem;

    setProgress(15, 'PARSING FILE');

    if (['tif','tiff'].includes(ext)) {
      const buf = await file.arrayBuffer();
      setProgress(40, 'DECODING GEOTIFF');
      dem = parseTIFF(buf);
    } else if (ext === 'asc') {
      const txt = await file.text();
      setProgress(40, 'PARSING GRID');
      dem = parseASC(txt);
    } else if (ext === 'png') {
      const buf = await file.arrayBuffer();
      setProgress(40, 'DECODING IMAGE');
      dem = await parsePNG(buf);
    } else if (['xyz','csv','txt'].includes(ext)) {
      const txt = await file.text();
      setProgress(40, 'GRIDDING POINTS');
      dem = parseXYZ(txt);
    } else if (ext === 'obj') {
      setProgress(20, 'READING OBJ…');
      const txt = await file.text();
      setProgress(50, 'PARSING MESH');
      dem = parseOBJ(txt);
    } else if (['bin','raw'].includes(ext)) {
      const buf = await file.arrayBuffer();
      setProgress(40, 'READING BINARY');
      const data = new Float32Array(buf);
      const side = Math.round(Math.sqrt(data.length));
      const f64  = new Float64Array(data.length);
      for (let i = 0; i < data.length; i++) f64[i] = data[i];
      dem = { width: side, height: Math.ceil(data.length / side), data: f64, noData: null };
    } else {
      throw new Error(`Format ".${ext}" not recognised.`);
    }

    setProgress(70, 'BUILDING MESH');
    demData = dem;

    let stats;
    if (dem.type === 'mesh') {
      colourMode = 'cmap'; // default to green hillshade for OBJ
      stats = buildMeshOBJ(dem, exaggeration);
      resetCamera(1.5);
    } else {
      stats = buildMesh(dem, currentCmap, exaggeration);
      const worldH = (dem.realHeight || dem.height) / (dem.realWidth || dem.width);
      resetCamera(worldH);
    }

    setProgress(90, 'UPLOADING TO GPU');
    drawColorbar(currentCmap, stats.zMin, stats.zMax);

    setTimeout(() => {
      setLoading(false);
      showViewer(dem, stats);
    }, 200);

  } catch(err) {
    setLoading(false);
    showError('⚠ ' + err.message);
    console.error(err);
  }
}

// ─── Event listeners ──────────────────────────────────────────────────────────
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');

dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) processFile(file);
});

// Also allow drop on canvas after load
document.getElementById('main').addEventListener('dragover', e => e.preventDefault());
document.getElementById('main').addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) { resetViewer(); setTimeout(() => processFile(file), 100); }
});

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) processFile(e.target.files[0]);
});

// Settings panel removed

// ─── Init ─────────────────────────────────────────────────────────────────────
initThree();
</script>
